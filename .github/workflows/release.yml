name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      # Artifacts are named FloatDeck-<tag> so regular, pre-release and
      # manually-dispatched tags all carry their identity in the filename.
      - name: Name artifacts
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          APK="FloatDeck-${TAG}.apk"
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/${APK}"
          zip -j "app/build/outputs/apk/release/${APK}.zip" "app/build/outputs/apk/release/${APK}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/FloatDeck-${{ steps.tag.outputs.tag }}.apk
            app/build/outputs/apk/release/FloatDeck-${{ steps.tag.outputs.tag }}.apk.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
