name: Shader Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-shaders:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Only match cache entries generated by this workflow's own runs,
          # keeping the shader CI independent from the main CI's cache
          # lifecycle. First run after merging to main populates the cache;
          # PR runs before that are simply cold (slower, still correct).
          gradle-home-cache-strict-match: true

      - name: Install glslang
        run: sudo apt-get update && sudo apt-get install -y glslang-tools

      - name: Validate shaders
        run: ./gradlew :app:validateShaders
