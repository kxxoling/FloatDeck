name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  check:
    if: github.event_name != 'pull_request' || github.head_ref != 'dev' || github.base_ref != 'main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run ktlint check
        run: ./gradlew ktlintCheck

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Dev builds carry the app name, current versionName and commit so they
      # are distinguishable from release artifacts.
      - name: Name dev APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          SHA=${GITHUB_SHA::7}
          mv app/build/outputs/apk/debug/app-debug.apk \
            "app/build/outputs/apk/debug/FloatDeck-dev-${VERSION}-g${SHA}.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: FloatDeck-dev-${VERSION}-g${SHA}
          path: app/build/outputs/apk/debug/FloatDeck-dev-*.apk
